<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        .date-selector { margin-bottom: 20px; background: #e8f0fe; padding: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
        input[type="date"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        #new-task { flex-grow: 1; padding: 10px; border: 2px solid #eee; border-radius: 5px; outline: none; }
        #new-task:focus { border-color: #1a73e8; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; transition: 0.3s; }
        li:last-child { border-bottom: none; }
        li.completed { background: #f8f9fa; color: #888; text-decoration: line-through; }
        input[type="checkbox"] { width: 18px; height: 18px; margin-right: 15px; cursor: pointer; }
        .task-text { font-size: 1.05rem; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>My Daily Goals</h1>
    
    <div class="date-selector">
        <strong>Date:</strong>
        <input type="date" id="task-date">
    </div>

    <div class="input-group">
        <input type="text" id="new-task" placeholder="Add a new task...">
        <button onclick="addNewTask()">Add</button>
    </div>

    <ul id="task-list"></ul>
</div>

<script>
    const taskDateInput = document.getElementById('task-date');
    const taskList = document.getElementById('task-list');
    const newTaskInput = document.getElementById('new-task');

    // Set today's date
    const today = new Date().toISOString().split('T')[0];
    taskDateInput.value = today;

    const defaultTasks = [
        "Go to Gym",
        "Complete Office task",
        "Study JAVA, SpringBoot - 1 hour",
        "Study System Design - 1 hour"
    ];

    function loadTasks() {
        const selectedDate = taskDateInput.value;
        taskList.innerHTML = '';

        let savedData = JSON.parse(localStorage.getItem('dailyTasks')) || {};
        
        // Initialize default tasks if date is new
        if (!savedData[selectedDate]) {
            savedData[selectedDate] = defaultTasks.map(task => ({
                text: task,
                completed: false
            }));
            localStorage.setItem('dailyTasks', JSON.stringify(savedData));
        }

        savedData[selectedDate].forEach((task, index) => {
            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');

            li.innerHTML = `
                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                <span class="task-text">${task.text}</span>
            `;
            taskList.appendChild(li);
        });
    }

    function toggleTask(index) {
        const selectedDate = taskDateInput.value;
        let savedData = JSON.parse(localStorage.getItem('dailyTasks'));
        savedData[selectedDate][index].completed = !savedData[selectedDate][index].completed;
        localStorage.setItem('dailyTasks', JSON.stringify(savedData));
        loadTasks();
    }

    function addNewTask() {
        const text = newTaskInput.value.trim();
        if (!text) return;
        const selectedDate = taskDateInput.value;
        let savedData = JSON.parse(localStorage.getItem('dailyTasks'));
        savedData[selectedDate].push({ text: text, completed: false });
        localStorage.setItem('dailyTasks', JSON.stringify(savedData));
        newTaskInput.value = '';
        loadTasks();
    }

    taskDateInput.addEventListener('change', loadTasks);
    window.onload = loadTasks;
</script>

</body>
</html>
